<table class="table">
  <thead>
    <tr>
      <th>Student</th>
      <th>Book</th>
      <th>Due Date</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    {% for loan in overdue_loans %}
      <tr class="{% if loan.is_overdue %}danger-row{% endif %}">
        <td>{{ loan.student.name }}<br><span class="muted">{{ loan.student.email }}</span></td>
        <td>{{ loan.book.title }}</td>
        <td>{{ loan.due_date }}</td>
        <td>
          <form method="post" action="{{ url_for('return_loan', loan_id=loan.id) }}">
            <button class="button button-small" type="submit">Record Return</button>
          </form>
        </td>
      </tr>
    {% else %}
      <tr><td colspan="4">No loans in this section.</td></tr>
    {% endfor %}
  </tbody>
</table>
